[versions]
agp                   = "9.2.1"
kotlin                = "2.4.20"
composeMultiplatform  = "1.12.1"
composeMaterial3      = "1.9.0"
composeBom            = "2026.09.00"
activityCompose       = "1.13.0"
lifecycle             = "2.11.0"
coreKtx               = "1.19.1"
coroutines            = "1.11.0"
kotpass               = "0.13.0"
biometric             = "1.1.0"
fragment              = "1.9.1"
okio                  = "3.15.0"
junit                 = "4.13.2"

[libraries]
androidx-core-ktx                      = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose              = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose     = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom                   = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui                    = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling            = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3             = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-android             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core                = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing               = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
compose-desktop-material3              = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
kotpass                                = { group = "app.keemobile", name = "kotpass", version.ref = "kotpass" }
androidx-biometric                     = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx                  = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
okio                                   = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
junit                                  = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application   = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform  = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp-library   = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
